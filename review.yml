aid: realtor-ca
name: REALTOR.ca
reviewer: API Evangelist
date: '2026-07-26'
homeMarket: Canada
tier: portal-marketplace
primaryDomain: realtor.ca
operator: >-
  The Canadian Real Estate Association (CREA) — a national cooperative trade association
  representing roughly 160,000 REALTORS® across about 60 member boards and associations. CREA
  owns and operates both the REALTOR.ca consumer portal and the REALTOR.ca Data Distribution
  Facility (DDF®) that syndicates member boards' MLS® System listings.

review:
  question: >-
    Does REALTOR.ca / CREA publish a real, reachable developer API surface, and is that surface
    RESO-certified or merely RESO-aligned?
  answer: >-
    Yes to a real and genuinely well-documented API surface; no to reachability without CREA
    membership, and no to any confirmable RESO certification. The DDF® Web API is a live OData
    service with a public OpenAPI 3.0.4 description and a public documentation site, but every
    endpoint — including the OData $metadata document that would be its machine-readable contract
    — returns HTTP 401 to an anonymous caller. There is no self-serve signup, no sandbox, and no
    public consumer search API for realtor.ca itself.

# ---------------------------------------------------------------------------
# THE POINT OF THE EXERCISE: certification is not reachability
# ---------------------------------------------------------------------------
sectorPosture:

  resoPosture:
    summary: >-
      RESO Data Dictionary-aligned, not confirmed RESO-certified. CREA is listed as a RESO member
      but no CREA / REALTOR.ca / DDF entry could be confirmed in the RESO certification directory.
    resoCertified: false
    certificationTypeClaimed: none
    dataDictionaryVersion: >-
      Not stated. CREA's own documentation says only that "MLS® System data is normalized based on
      the RESO Data Dictionary standards" — no version number (1.7, 2.0, etc.) appears anywhere in
      the 35,698-character DDF® Web API description, and the strings "certif", "RETS", "UPI" and
      "Universal Property" do not appear in it at all.
    webApiCoreVersion: >-
      Not stated. The surface is OData with RESO Data Dictionary resource and field names
      (Property, Member, Office, OpenHouse, ListingKey, OfficeStateOrProvince, CommonInterest,
      MemberDesignation), plus two CREA-specific resources that are NOT RESO — Destination and
      Lead. CREA never claims a RESO Web API Core certification level.
    upi:
      present: false
      note: >-
        No RESO Universal Property Identifier (UPI) reference anywhere in the DDF® documentation or
        the harvested OpenAPI. Records are keyed on ListingKey / PropertyKey / MemberKey /
        OfficeKey / DestinationKey.
    odataMetadata:
      url: https://ddfapi.realtor.ca/odata/v1/$metadata
      httpStatus: 401
      harvested: false
      note: >-
        The $metadata document IS the RESO/OData machine-readable contract and it is NOT publicly
        readable. Anonymous GET returns `WWW-Authenticate: Bearer` and the JSON body
        {"error":{"message":"You are not authorized to perform this request. The format of the
        bearer token used is not valid.","code":"401"}} (Server: Kestrel). CREA's own docs say
        plainly: "Metadata can be found by querying https://ddfapi.realtor.ca/odata/v1/$metadata
        (Requires authentication)."
    resoDirectoryEvidence:
      - url: https://www.reso.org/certification/
        httpStatus: 200
        finding: >-
          Zero occurrences of "CREA", "Canadian", "REALTOR.ca" or "DDF" in the page text. The page
          notes "more than 30" MLS systems in Canada but names none, and links the live directory
          out to certification.reso.org.
      - url: https://certification.reso.org/
        httpStatus: 200
        finding: >-
          Client-rendered single-page app (1,312-byte shell, all data loaded by
          /public/dist/bundle-*.js). The certified-organization list could not be read
          anonymously without executing JavaScript, so a CREA entry can be neither confirmed nor
          ruled out from this source.
      - url: https://www.reso.org/canadian-membership/
        httpStatus: 200
        finding: >-
          CREA ("The Canadian Real Estate Association | L'Association canadienne de l'immobilier")
          is named among RESO's Canadian MEMBER organizations. Membership only — the page states
          no certification status for any Canadian organization.
      - url: https://www.reso.org/blog/expanding-intl-data/
        httpStatus: 200
        finding: >-
          RESO's own blog quotes Patrick Pichette of CREA: "CREA is in the process of translating
          the Data Dictionary into French with RESO" and "Canada has further to go but has a
          strategic priority to adopt the RESO Web API with its data partners." That is adoption
          language, not certification language.
    verdict: >-
      Record this as RESO-ALIGNED, NOT RESO-CERTIFIED. CREA has voluntarily adopted the RESO Data
      Dictionary vocabulary and an OData transport that looks like the RESO Web API, without the
      NAR-adjacent certification machinery that drives US MLSs. Canada's single national
      cooperative got the interoperability benefit of the standard without needing the mandate.

  accessGate:
    classification: membership-required
    gated: true
    selfServeSignup: false
    sandbox: false
    freeTier: false
    whatADeveloperMustJoinOrSign:
      - >-
        You must be, or be sponsored by, a CREA member — a licensed REALTOR® or a broker owner.
        crea.ca/ddf/ states the DDF® is "a managed service for REALTORS® and broker owners" and
        that "Broker owners have control over how their listings are shared and can manage
        permissions for salespeople."
      - >-
        A member or broker owner must create and register a DDF® data feed ("Destination") in the
        member portal at member.realtor.ca/Distribution/Default.aspx (probed 2026-07-26, HTTP 302
        to an authenticated login — no anonymous access). Feed types named in CREA's docs are
        "Member Website Feeds – My Listings", "Member Website Feed - All Offices" and "National
        Shared Pool".
      - >-
        Acceptance of the REALTOR.ca DDF® Member Policy and Rules
        (https://www.crea.ca/ddf/member-policy-and-rules/, HTTP 200) governs the feed. There is no
        separately published developer terms-of-service or self-serve API agreement.
      - >-
        A third-party "Technology Provider" does not get its own independent key. Per CREA's
        Technology Provider guide, a Technology Provider is "an organization that pulls multiple
        data feeds for different users" — it operates on the Destinations that individual members
        and brokerages have linked to it, and queries the Destination resource to enumerate them.
        No member links a feed to you, no data.
      - >-
        Display obligations ride along with the data: DDF® sites must show a "Powered by
        REALTOR.ca" attribution image (English and French variants specified in the docs), and
        real estate advertising websites are REQUIRED to route "Email REALTOR®" submissions
        through the DDF® Lead API because member email addresses are withheld from the feed
        payloads.
    credentialIssuance: >-
      client_id and client_secret are literally "the username of your Destination" and "the
      password of your Destination" — i.e. the credentials of a member-registered data feed, not
      of a developer account. There is no developer registration form, no application review
      queue, and no public key-issuance path.

  openData:
    exists: false
    note: >-
      Neither REALTOR.ca nor CREA publishes an open, unlicensed, publicly callable dataset. CREA's
      national housing statistics and the MLS® Home Price Index are published as web reports at
      https://www.crea.ca/housing-market-stats/ (HTTP 200) and https://stats.crea.ca/ (HTTP 200,
      /en-CA/ HTTP 200) with no documented API, no bulk download endpoint, and no open licence
      located. Canada also has no federal open counterweight equivalent to HM Land Registry Price
      Paid or Ordnance Survey open products — land registration is provincial and, in Ontario and
      several other provinces, operated under long-term private concession (Teranet), so the
      public record itself is a commercial product rather than an open dataset.

  authModel:
    scheme: OAuth 2.0 client_credentials (Bearer), via an OpenID Connect-capable IdentityServer
    tokenEndpoint: https://identity.crea.ca/connect/token
    authorizationEndpoint: https://identity.crea.ca/connect/authorize
    introspectionEndpoint: https://identity.crea.ca/connect/introspect
    tokenLifetime: 60 minutes
    documentedFlow: >-
      POST /connect/token to identity.crea.ca as application/x-www-form-urlencoded with
      grant_type=client_credentials, client_id (Destination username), client_secret (Destination
      password) and scope=DDFApi_Read; then send `Authorization: Bearer {access_token}` on every
      DDF® call.
    scopesObserved:
      - openid
      - DDFApi_Read
      - OfferManagementApi.read.write
      - BoardDataApi.read
      - offline_access
    grantTypesObserved:
      - authorization_code
      - client_credentials
      - refresh_token
      - implicit
      - 'urn:ietf:params:oauth:grant-type:device_code'
      - 'urn:openid:params:grant-type:ciba'
    secondIdentityProvider:
      issuer: https://auth.realtor.ca/
      vendor: Auth0
      role: >-
        Member/consumer login for realtor.ca itself. ddf.realtor.ca (HTTP 302) redirects into the
        Auth0 universal login at auth.realtor.ca/u/login. This is a human sign-in surface, not a
        developer API gate.
      scopesObserved:
        - openid
        - profile
        - email
        - offline_access
        - address
        - phone

