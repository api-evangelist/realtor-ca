harvest:
  specsCount: 2
  openapiHarvested: true
  artifacts:
    - path: openapi/realtor-ca-ddf-web-api-openapi.json
      sourceURL: https://ddfapi.realtor.ca/swagger/v1/swagger.json
      httpStatus: 200
      contentType: application/json;charset=utf-8
      bytes: 278444
      fetchedDate: '2026-07-26'
      format: OpenAPI 3.0.4
      parsed: true
      paths: 17
      schemas: 157
      note: >-
        Fetched verbatim, anonymously. info.description is EMPTY in this copy and servers[] is
        [{"url": "https://localhost:7051"}] — a development artifact left in the published
        document; the real base URL is https://ddfapi.realtor.ca. No components.securitySchemes
        block is declared even though every operation requires a Bearer token.
    - path: openapi/realtor-ca-ddf-web-api-docs-openapi.json
      sourceURL: https://ddfapi-docs.realtor.ca/
      httpStatus: 200
      fetchedDate: '2026-07-26'
      format: OpenAPI 3.0.4
      parsed: true
      paths: 17
      schemas: 157
      note: >-
        The OpenAPI document embedded as `var model = {...}` in the documentation page, extracted
        and re-serialized without alteration of content. Identical path and schema set to the
        swagger.json copy, but carries the full 35,698-character info.description that the
        swagger.json copy omits. Kept alongside it because that description is the only place
        CREA documents the auth flow, OData query patterns, the Technology Provider model, the
        Analytics web service and the attribution requirements.
    - path: authentication/realtor-ca-crea-identity-openid-configuration.json
      sourceURL: https://identity.crea.ca/.well-known/openid-configuration
      httpStatus: 200
      fetchedDate: '2026-07-26'
      format: OpenID Connect Discovery 1.0
      parsed: true
      note: Fetched anonymously, verbatim. Issuer https://identity.crea.ca (IdentityServer).
    - path: authentication/realtor-ca-auth0-openid-configuration.json
      sourceURL: https://auth.realtor.ca/.well-known/openid-configuration
      httpStatus: 200
      fetchedDate: '2026-07-26'
      format: OpenID Connect Discovery 1.0
      parsed: true
      note: Fetched anonymously, verbatim. Issuer https://auth.realtor.ca/ (Auth0 tenant).
  notHarvested:
    - target: https://ddfapi.realtor.ca/odata/v1/$metadata
      httpStatus: 401
      reason: Bearer token required; CREA documents this explicitly as "(Requires authentication)".

# ---------------------------------------------------------------------------
# Documented API surface, as CREA segments it
# ---------------------------------------------------------------------------
documentedOperations:
  ddfWebApi:
    baseURL: https://ddfapi.realtor.ca/odata/v1
    resources:
      - GET /odata/v1/Property
      - GET /odata/v1/Property/{PropertyKey}
      - GET /odata/v1/Property/PropertyReplication()
      - GET /odata/v1/Property/PropertyReplication(DestinationId={DestinationId})
      - GET /odata/v1/Member
      - GET /odata/v1/Member/{MemberKey}
      - GET /odata/v1/Member/MemberReplication()
      - GET /odata/v1/Member/MemberReplication(DestinationId={DestinationId})
      - GET /odata/v1/Office
      - GET /odata/v1/Office/{OfficeKey}
      - GET /odata/v1/Office/OfficeReplication()
      - GET /odata/v1/Office/OfficeReplication(DestinationId={DestinationId})
      - GET /odata/v1/OpenHouse
      - GET /odata/v1/OpenHouse/{OpenHouseKey}
      - GET /odata/v1/Destination
      - GET /odata/v1/Destination/{DestinationKey}
    note: >-
      Read-only. Media is a selectable collection on Property rather than a standalone RESO Media
      resource. Destination is a CREA-specific resource with no RESO analogue — it exists because
      the unit of entitlement in Canada is a member-registered feed, not an MLS.
  ddfLeadApi:
    baseURL: https://ddfapi.realtor.ca/v1
    resources:
      - POST /v1/Lead/CreateLead
    note: >-
      The only write operation. Query parameter SuppressEmail=true is documented for testing so
      that test traffic does not email real REALTORS®.
  analyticsWebService:
    baseURL: https://analytics.crea.ca/LogEvents.svc
    resources:
      - /LogEvents.svc/LogEvents
    eventTypes:
      - View
      - Click
      - email_realtor
    note: >-
      Fire-and-forget; "No response handling is required, so these requests may be made
      asynchronously." Duplicate events from the same UUID inside a 5-minute window are ignored.

productSegmentation:
  listingsAndSearch: >-
    DDF® Web API Property / OpenHouse resources — the national listing pool, filtered by whatever
    Destinations a Technology Provider is linked to. This is the whole product.
  agentsAndOffices: DDF® Web API Member and Office resources.
  leadGeneration: DDF® Lead API (mandatory for real estate advertising websites).
  analytics: CREA Analytics Web Service (listing view/click/email tracking).
  propertyRecords: Not offered. Land registration is provincial and largely privatised (Teranet and peers); CREA has no title or public-record product.
  valuationAVM: Not offered by CREA.
  transactions: >-
    An OfferManagementApi scope exists on identity.crea.ca, implying an offer-management product,
    but no public documentation for it was found.
  documents: Not offered.
  tenancy: >-
    Rentals appear as listing types within REALTOR.ca; there is no separate tenancy API.
  payments: Not offered.
  commercial: Commercial listings appear on REALTOR.ca; no separate commercial API surface.

undocumentedSurfaces:
  - name: Offer Management API
    evidence: >-
      The scope `OfferManagementApi.read.write` is advertised in the anonymously readable
      identity.crea.ca discovery document.
    documentation: none found
    hostsProbed:
      - {url: 'https://offerapi.crea.ca/', status: 000}
      - {url: 'https://offermanagement-docs.realtor.ca/', status: 000}
    decision: >-
      NOT listed in apis.yml. A scope name is evidence that an API exists somewhere inside CREA's
      estate; it is not a documented API, a host, or an endpoint, and none was invented.
  - name: Board Data API
    evidence: >-
      The scope `BoardDataApi.read` is advertised in the same discovery document.
    documentation: none found
    hostsProbed:
      - {url: 'https://boarddataapi.crea.ca/', status: 000}
      - {url: 'https://boarddata-docs.realtor.ca/', status: 000}
    decision: NOT listed in apis.yml, for the same reason.
  - name: realtor.ca consumer search
    evidence: >-
      The public realtor.ca site plainly issues search calls from the browser, but CREA publishes
      no developer documentation, no terms, and no key issuance for a consumer search API.
    decision: >-
      NOT listed. Only documented APIs are recorded; no internal or reverse-engineered endpoint
      was captured.

absences:
  webhooks: >-
    None. The strings "webhook" and "Webhook" do not appear anywhere in the DDF® documentation.
    Change propagation is polling-based: clients re-query the Replication endpoints with a
    LastUpdated filter.
  events: >-
    No event stream, no AsyncAPI, no WebSocket, no SSE. The only event-shaped surface is outbound
    — the site tells CREA about listing views via the Analytics Web Service, not the reverse.
  sdks: None published by CREA. Third-party WordPress plugins and importers exist but are not CREA artifacts.
  postmanCollection: >-
    None published. CREA's docs recommend Postman as the client of choice for testing and include
    screenshots of it, but ship no collection to import.
  graphql: None.
  rateLimits: >-
    None documented — "rate limit", "throttle" and "limit" do not appear in the DDF® documentation.
    The only stated constraint is a 60-minute access-token lifetime and a 5-minute analytics event
    de-duplication window.
  statusPage: None found.
  sandbox: None.
  publicSignup: None.

marketSeamNotes: >-
  Canada is the clean counter-example to the United States. One national cooperative — CREA —
  operates both the consumer portal and the syndication rail, so a developer integrates once
  against ddfapi.realtor.ca rather than negotiating with ~500 separate MLSs. That consolidation
  produces a far better developer artifact than the US average (one base URL, one token endpoint,
  one public OpenAPI, one documentation site, one forum) while producing a much HARDER gate: there
  is no MLS to shop around for. Entitlement flows through individual REALTORS® and broker owners
  who register Destinations and link them to a Technology Provider, which is why "Destination" is
  a first-class resource in the API. It also explains the challenger layer — HouseSigma, Wahi,
  Zolo, Properly — competing on data CREA controls and distributes. And it explains what is
  missing: because Canadian land registration is provincial and largely operated under private
  concession, there is no public-record API anywhere in this stack, and no open-data counterweight
  of the kind HM Land Registry or Ordnance Survey provide in the UK.

conclusion: >-
  REALTOR.ca / CREA is the sector's cleanest illustration of the distinction this study is testing.
  The contract quality is genuinely good — a live OpenAPI 3.0.4 at a public URL, thorough public
  documentation, a public changelog, a public developer forum, and an anonymously readable OpenID
  Connect discovery document that even names the scopes. Every one of those is more than most
  organizations in this sector publish. And none of it gets you a single listing. The data is
  behind a membership gate that no amount of developer intent can open: you must be a REALTOR® or
  a broker owner, or be linked by one, and the credentials you receive are a feed's credentials,
  not yours. Certified or not — and CREA is not certified, only RESO-aligned — reachability is the
  binding constraint.
