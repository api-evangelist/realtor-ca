note: 'CREA publishes NO official MCP server. No mcp.* / *.mcp host resolves in the crea.ca or realtor.ca
  estate, the DDF Web API documentation never mentions MCP or agents, and there is no CREA GitHub organization.
  The tool list below is a CANDIDATE derived one-per-operation from the harvested OpenAPI 3.0.4 — it is
  what an MCP server over the DDF Web API would expose, not something CREA ships. Every tool inherits
  its real input contract from the OData query parameters ($select/$filter/$top/$skip/$orderby/$count)
  declared on the backing path. Any such server is only useful with a CREA-issued data-feed credential:
  every DDF endpoint returns HTTP 401 without a Bearer token from https://identity.crea.ca/connect/token.'
server:
  name: realtor-ca-ddf
  transport: http
  url: null
  published_by_provider: false
auth:
  type: oauth2
  flow: client_credentials
  token_url: https://identity.crea.ca/connect/token
  scope: DDFApi_Read
  note: client_id/client_secret are the username/password of a member-registered DDF Destination feed.
community_implementations:
