- aid: realtor-ca:realtor-ca-ddf-lead-api
  name: REALTOR.ca DDF Lead API
  description: >-
    The DDF® Lead API accepts an email lead for a REALTOR® from a downstream site. Because
    member email addresses are deliberately excluded from the DDF® Web API payloads, real estate
    advertising websites displaying DDF® listings are required to route "Email REALTOR®" form
    submissions through this endpoint. It is the only write operation in the documented DDF®
    surface, and it requires the same OAuth 2.0 Bearer access token as the read endpoints.
  humanURL: https://ddfapi-docs.realtor.ca/
  baseURL: https://ddfapi.realtor.ca/v1
  tags:
