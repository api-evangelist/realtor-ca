apis:
- aid: realtor-ca:crea-analytics-web-service
  name: CREA Analytics Web Service
  description: >-
    A fire-and-forget listing-event logging service documented inside the DDF® Web API documentation.
    Sites and applications displaying DDF® listings call it to record View, Click and email_realtor events
    against a ListingID and DestinationID so that agents and broker owners can see where their listings
    are being consumed. Requests carry ListingID, DestinationID, EventType, UUID and optional IP, ReferralURL
    and LanguageID arguments; no response handling is required.
  humanURL: https://ddfapi-docs.realtor.ca/
  baseURL: https://analytics.crea.ca/LogEvents.svc
  tags:
  - Analytics
  - Event
  - Listings
  tags_raw:
  - Analytics
  - Events
  - Listings
  properties:
  - type: Documentation
    url: https://ddfapi-docs.realtor.ca/
- aid: realtor-ca:crea-identity-server
  name: CREA Identity Server
  description: >-
    CREA's OAuth 2.0 / OpenID Connect authorization server at identity.crea.ca, which issues the access
    tokens every DDF® Web API call requires. Its discovery document is served anonymously and advertises
    the client_credentials, authorization_code, refresh_token, implicit, device_code and CIBA grants,
    and four scopes — openid, DDFApi_Read, OfferManagementApi.read.write and BoardDataApi.read. The documented
    DDF® flow is client_credentials with scope DDFApi_Read, where client_id and client_secret are the
    username and password of a registered DDF® Destination data feed. Tokens are valid for 60 minutes.
  humanURL: https://ddfapi-docs.realtor.ca/
  baseURL: https://identity.crea.ca
  tags:
  - Authentication
  - OpenID Connect
  - Identity
  tags_raw:
  - Authentication
  - OAuth
  - OpenID Connect
  - Identity
