apis:
- aid: realtor-ca:realtor-ca-ddf-web-api
  name: REALTOR.ca DDF Web API
  description: >-
    The REALTOR.ca Data Distribution Facility (DDF®) Web API is CREA's national listing
    distribution surface, exposed as OData v4-style read endpoints over Property, Member, Office,
    OpenHouse and Destination resources, with per-resource Replication endpoints for full and
    incremental (LastUpdated) pulls. MLS® System data received from Canadian boards and
    associations is normalized to the RESO Data Dictionary. All endpoints, including the OData
    $metadata document, require an OAuth 2.0 Bearer access token obtained with data-feed
    credentials; anonymous requests return HTTP 401.
  humanURL: https://ddfapi-docs.realtor.ca/
  baseURL: https://ddfapi.realtor.ca/odata/v1
