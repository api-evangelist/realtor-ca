url: https://raw.githubusercontent.com/api-evangelist/realtor-ca/refs/heads/main/apis.yml
name: REALTOR.ca
kind: company
description: >-
  REALTOR.ca is the national residential property listing portal of the Canadian Real Estate
  Association (CREA), the cooperative trade association representing roughly 160,000 REALTORS®
  across some 60 member boards and associations in Canada. Unlike the United States, where
  roughly 500 independent MLSs each run their own data pipe, Canadian listing distribution is
  consolidated through CREA's REALTOR.ca Data Distribution Facility (DDF®), a single national
  syndication service that normalizes MLS® System data from member boards and republishes it to
  member websites, franchisor sites, real estate advertising websites and technology providers.
  CREA sits squarely in the middle of the Canadian value chain — it owns the consumer portal, the
  national listing pool, and the syndication rails that every downstream site depends on. Its API
  posture is real but closed: the DDF® Web API is a genuine OData surface at
  https://ddfapi.realtor.ca/odata/v1 with public, browsable documentation and a downloadable
  OpenAPI 3.0.4 description, yet every endpoint (including the OData $metadata document) returns
  401 without a Bearer token, and tokens are only issued via client_credentials against
  identity.crea.ca using data-feed credentials that a REALTOR® or broker owner must first create
  and link in the member portal. CREA is a RESO member and states its data is normalized to the
  RESO Data Dictionary, but no CREA entry could be confirmed in the RESO certification directory,
  so this profile records the DDF® Web API as RESO-aligned rather than RESO-certified. There is no
  self-serve developer signup, no sandbox, no open data product, and no public consumer search API
  for realtor.ca itself.
