        Heating:
          type:
          - Array of Strings
          - 'null'
          items:
            type: integer
            format: int32
          description: A list describing the heating features of the property.
          format: 'Enum: Heating'
          example:
          - Heat Pump
        FoundationDetails:
          type:
          - Array of Strings
          - 'null'
          items:
            type: integer
            format: int32
