        Basement:
          type:
          - Array of Strings
          - 'null'
          items:
            type: integer
            format: int32
          description: A list of information and features about the basement. i.e. None/Slab, Finished, Partially Finished, Crawl Space, Dirt, Outside Entrance, Radon Mitigation
