          example: Appraiser
        LivingAreaMinimum:
          type:
          - number
          - 'null'
          description: The minimum livable area within the structure.
          format: double
          example: 100
        LivingAreaMaximum:
          type:
          - number
          - 'null'
          description: The maximum livable area within the structure.
          format: double
          example: 100
        FireplacesTotal:
          type:
          - integer
          - 'null'
