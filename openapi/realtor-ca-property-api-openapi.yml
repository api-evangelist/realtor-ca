          format: double
          example: 100
        AboveGradeFinishedAreaMaximum:
          type:
          - number
          - 'null'
          description: The maximum finished area within the structure that is at or above the surface of the ground.
          format: double
          example: 100
        BelowGradeFinishedArea:
