- date: '2026-05-07'
  breaking: true
  highlights:
  - >-
    MediaKey on the Media object of Property, Member and Office payloads changes from a
    numeric/bigint to a string formatted <ObjectID>_<MediaCategoryId>_<MediaPosition>.
  - >-
    MediaKey stops changing when unrelated payload data changes; clients must monitor the Media
    object's own ModificationTimestamp to detect photo changes.
  - One-time reseeding event reissues MediaKey for all Member objects.
  - Deleting and re-uploading a photo shifts MediaPosition, so all Media objects should be refreshed.
- date: '2026-02-05'
  breaking: false
  additions:
  - ListAgentNationalAssociationId
  - CoListAgentNationalAssociationId
  - CoListAgentNationalAssociationId2
  - CoListAgentNationalAssociationId3
  - ListOfficeNationalAssociationId
  - CoListOfficeNationalAssociationId
  - CoListOfficeNationalAssociationId2
  - CoListOfficeNationalAssociationId3
  highlights:
  - National Association identifier fields added to the Property payload, filterable and orderable.
  - Lead API matching logic expanded to route leads sent with CoListAgentKey2/CoListAgentKey3.
  - SocialMediaType and ResourceName documented as string-based enums with correct types and examples.
- date: '2025-11-26'
