standards:
- id: odata-v4
  conforms: true
  evidence: >-
    Resource paths under /odata/v1 with $select/$filter/$top/$skip/$orderby/$count query options,
    OData logical operators (eq/ne/gt/lt/ge/le/and/or/not/in/has), the `any` lambda, and responses
    carrying @odata.context / @odata.nextLink / value. Server is ASP.NET Core OData (schema names
    Microsoft.AspNetCore.OData.* appear in the published spec).
- id: reso-data-dictionary
  conforms: true
  certified: false
  evidence: >-
    CREA states "MLS System data is normalized based on the RESO Data Dictionary standards" and the
    payloads use RESO field names (ListingKey, ListPrice, LivingArea, AboveGradeFinishedArea,
    CommonInterest, MemberDesignation, OriginatingSystemName). No Data Dictionary version number
    is published anywhere in the 35,698-character documentation.
  note: >-
    Aligned, not confirmed certified. CREA appears in RESO's Canadian MEMBER list; no CREA /
    REALTOR.ca / DDF entry could be confirmed in the RESO certification directory (which renders
    client-side and could not be read anonymously).
- id: reso-web-api-core
