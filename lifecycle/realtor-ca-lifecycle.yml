  announced_deprecations:
  - item: MapCoordinateVerifiedYN
    scope: Property response payload field
    announced: '2025-11-26'
    replacement: GeoCodeManualYN
    removal_date: null
    source: https://ddfapi-docs.realtor.ca/releasenotes
    note: >-
      "This field is now deprecated and should not be referenced by clients. Clients currently
      using MapCoordinateVerifiedYN must update their integrations to use GeoCodeManualYN."
  breaking_changes_announced:
  - item: MediaKey
    scope: Media object on Property, Member and Office payloads
    announced: '2026-05-07'
    change: >-
      MediaKey changes from a numeric/bigint to a string of the form
      <ObjectID>_<MediaCategoryId>_<MediaPosition>, and stops churning on unrelated payload edits;
      clients must switch to watching the Media object's own ModificationTimestamp. A one-time
      reseeding event reissues MediaKey for all Member objects.
      A type change on a primary key, announced in release notes with no version bump and no
      deprecation window.
    source: https://ddfapi-docs.realtor.ca/releasenotes
